name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight, so CI
# reports on the current head rather than finishing work on a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json. Keep the two in step.
          node-version: 22
          cache: npm

      # ci, not install: it installs exactly what the lockfile pins and
      # fails if package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Runtime dependencies only, and only high and critical block. A
      # moderate advisory can land against a transitive dependency at any
      # time, often before a fix exists, and should not stop an unrelated
      # change from shipping - the advisory job below still reports it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The hand-written module list this replaced named five of the
      # thirteen routers, so a router added later - or a broken import
      # inside one of the eight it did not name - went straight past it.
      # The script reads the directories instead: 54 modules, and it
      # cannot drift.
      - name: Check every module imports
        run: npm run smoke

  audit-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reported, never blocking: a dev-tool advisory is worth knowing about
      # but should not stop a fix from shipping.
      - name: Audit everything (advisory)
        run: npm audit --audit-level=low || true
